<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Linkweaver audits a site's internal linking, surfacing orphan pages and the related pages that should be linking to them."
    />
    <title>Linkweaver</title>

    <!--
      Resolve the theme before first paint so a dark-mode user never sees a
      flash of the light palette. Kept inline and dependency-free on purpose;
      the React ThemeProvider reads the same attribute and storage key.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('lw-theme')
          var resolved =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = resolved
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
