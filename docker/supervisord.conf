; Runs the three processes this container needs.
;
; The queue worker is the reason Supervisor is here at all: on a single-service
; free tier there is nowhere else to put it, and without it projects would
; queue forever (see the queue-staleness check on /api/health).

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
; --max-time recycles the worker hourly so a long-lived process cannot leak
; memory on a 512 MB container. --tries matches the jobs' own retry budget.
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=900
user=www-data
autostart=true
autorestart=true
priority=20
stopwaitsecs=930
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
