# nginx in front of php-fpm, both inside the one container.

user www-data;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs go to the container's stdout so the platform collects them; a free
    # tier has no persistent disk worth writing to.
    access_log /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;
    keepalive_timeout 30;

    # Crawl responses can be large, and the API returns whole link graphs.
    client_max_body_size 8M;
    gzip on;
    gzip_types application/json text/csv text/plain application/javascript text/css;
    gzip_min_length 1024;

    server {
        # PORT is substituted by the entrypoint: Render assigns one, and it is
        # not known at build time.
        listen ${PORT};
        server_name _;
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

            # The crawl endpoints only dispatch jobs, but an export of a large
            # project streams for a while.
            fastcgi_read_timeout 120;
        }

        # Nothing outside public/ is reachable, but be explicit about the
        # files people most often leak.
        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
